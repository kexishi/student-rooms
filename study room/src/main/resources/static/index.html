<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自习室预约系统</title>
    <link rel="stylesheet" href="/css/style.css?v=3">
    <style>
        /* 时间段选择样式 - 内联确保生效 */
        .time-slot-option {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            background-color: #fff;
            margin: 5px 0;
        }
        .time-slot-option:hover:not(.occupied) {
            border-color: #3498db;
            background-color: #ebf5fb;
        }
        .time-slot-option input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
            margin-right: 10px;
        }
        .time-slot-option.occupied {
            background-color: #e9ecef !important;
            border-color: #adb5bd !important;
            cursor: not-allowed !important;
            opacity: 0.6;
        }
        .time-slot-option.occupied input[type="checkbox"] {
            cursor: not-allowed;
            opacity: 0.5;
        }
        .time-slot-option.occupied span {
            color: #6c757d;
        }
        .time-slot-option.occupied .occupied-label {
            color: #dc3545;
            font-size: 12px;
            margin-left: auto;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="app">
        <!-- 顶部导航 -->
        <header class="header">
            <h1>自习室管理预约系统</h1>
            <div id="user-info" class="user-info">
                <button id="login-btn" onclick="showLogin()">登录</button>
                <button id="register-btn" onclick="showRegister()">注册</button>
            </div>
        </header>

        <!-- 主内容区 -->
        <main class="main">
            <!-- 登录/注册弹窗 -->
            <div id="modal-overlay" class="modal-overlay">
                <div id="modal" class="modal">
                    <span class="close" onclick="closeModal()">&times;</span>
                    <div id="modal-content"></div>
                </div>
            </div>

            <!-- 自习室列表 -->
            <section id="study-rooms-section" class="section">
                <div class="section-header">
                    <h2>自习室列表</h2>
                    <button class="btn btn-primary" id="add-room-btn" onclick="showAddRoom()" style="display: none;">
                        + 新增自习室
                    </button>
                </div>
                <div id="rooms-list" class="rooms-grid">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 座位和预约 -->
            <section id="seats-section" class="section" style="display: none;">
                <div class="section-header">
                    <h2 id="room-title">座位选择</h2>
                    <button class="btn btn-secondary" onclick="backToRooms()">返回</button>
                </div>
                <div id="seats-list" class="seats-grid">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 我的预约 -->
            <section id="reservations-section" class="section" style="display: none;">
                <div class="section-header">
                    <h2>我的预约</h2>
                    <button class="btn btn-secondary" onclick="showStudyRooms()">返回</button>
                </div>
                <div id="reservations-list">
                    <!-- 动态生成 -->
                </div>
            </section>

            <!-- 管理员预约管理 -->
            <section id="admin-reservations-section" class="section" style="display: none;">
                <div class="section-header">
                    <h2>预约管理（管理员）</h2>
                    <div>
                        <select id="reservation-status-filter" onchange="filterReservationsByStatus()" style="padding: 8px; margin-right: 10px; border-radius: 4px; border: 1px solid #ddd;">
                            <option value="all">全部状态</option>
                            <option value="PENDING">待确认</option>
                            <option value="CONFIRMED">已确认</option>
                            <option value="CANCELLED">已取消</option>
                            <option value="COMPLETED">已完成</option>
                        </select>
                        <button class="btn btn-secondary" onclick="backToHome()">返回</button>
                    </div>
                </div>
                <div id="admin-reservations-list">
                    <!-- 动态生成 -->
                </div>
            </section>
        </main>
    </div>

    <script src="/js/api.js?v=6"></script>
    <script src="/js/app.js?v=14"></script>
</body>
</html>
